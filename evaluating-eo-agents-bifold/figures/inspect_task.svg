<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 840 456' width='840' height='456' font-family='system-ui, -apple-system, Segoe UI, Helvetica, Arial, sans-serif'><defs><marker id='arrow' viewBox='0 0 10 10' refX='9' refY='5' markerWidth='7' markerHeight='7' orient='auto'><path d='M0,0 L10,5 L0,10 z' fill='#59636e'/></marker></defs><rect x='0' y='0' width='840' height='456' fill='white'/><rect x='10' y='10' width='820' height='436' rx='14' fill='none' stroke='#1f2328' stroke-width='1.6'/><text x='28' y='38' font-size='16' font-weight='700' fill='#1f2328'>agentic_evals: our evaluation harness, built on Inspect AI</text><text x='28' y='58' font-size='11.5' fill='#59636e'>One evaluation is one Inspect task; the harness supplies the benchmarks, MCP tools, solvers, scorers and configs.</text><rect x='20' y='72' width='800' height='40' rx='8' fill='#8b949e' fill-opacity='.12' stroke='#8b949e' stroke-width='1.5'/><text x='420' y='97' font-size='12.5' text-anchor='middle' fill='#1f2328'>Run configuration (YAML): model and endpoint, task arguments, samples, epochs, generation settings</text><line x1='420' y1='112' x2='420' y2='130' stroke='#59636e' stroke-width='1.5' marker-end='url(#arrow)'/><rect x='20' y='130' width='800' height='180' rx='14' fill='none' stroke='#59636e' stroke-opacity='.6' stroke-dasharray='6 4'/><text x='34' y='150' font-size='11.5' font-weight='700' letter-spacing='.6' fill='#59636e'>INSPECT TASK: ONE EVALUATION</text><rect x='36' y='164' width='176' height='120' rx='8' fill='#0969da' fill-opacity='.12' stroke='#0969da' stroke-width='1.5'/><text x='48' y='190' font-size='15' font-weight='700' fill='#1f2328'>Dataset</text><text x='48' y='212' font-size='11.5' fill='#1f2328'>questions, gold answers</text><text x='48' y='229' font-size='11.5' fill='#1f2328'>and gold tool calls</text><line x1='214' y1='224' x2='230' y2='224' stroke='#59636e' stroke-width='1.5' marker-end='url(#arrow)'/><rect x='232' y='164' width='176' height='120' rx='8' fill='#8b949e' fill-opacity='.12' stroke='#8b949e' stroke-width='1.5'/><text x='244' y='190' font-size='15' font-weight='700' fill='#1f2328'>Setup</text><text x='244' y='212' font-size='11.5' fill='#1f2328'>starts the sample's</text><text x='244' y='229' font-size='11.5' fill='#1f2328'>MCP tool servers</text><text x='244' y='246' font-size='11.5' fill='#1f2328'>records the endpoint</text><line x1='410' y1='224' x2='426' y2='224' stroke='#59636e' stroke-width='1.5' marker-end='url(#arrow)'/><rect x='428' y='164' width='176' height='120' rx='8' fill='#8250df' fill-opacity='.12' stroke='#8250df' stroke-width='1.5'/><text x='440' y='190' font-size='15' font-weight='700' fill='#1f2328'>Solver</text><text x='440' y='212' font-size='11.5' fill='#1f2328'>your agent: a LangGraph</text><text x='440' y='229' font-size='11.5' fill='#1f2328'>graph run through</text><text x='440' y='246' font-size='11.5' fill='#1f2328'>agent_bridge()</text><line x1='606' y1='224' x2='622' y2='224' stroke='#59636e' stroke-width='1.5' marker-end='url(#arrow)'/><rect x='624' y='164' width='176' height='120' rx='8' fill='#2ea043' fill-opacity='.12' stroke='#2ea043' stroke-width='1.5'/><text x='636' y='190' font-size='15' font-weight='700' fill='#1f2328'>Scorers</text><text x='636' y='212' font-size='11.5' fill='#1f2328'>the benchmark's own</text><text x='636' y='229' font-size='11.5' fill='#1f2328'>metrics, plus optional</text><text x='636' y='246' font-size='11.5' fill='#1f2328'>LLM judges</text><text x='34' y='302' font-size='11.5' fill='#59636e'>Solver and scorers run once per sample. An epoch repeats the whole task.</text><line x1='148' y1='312' x2='148' y2='348' stroke='#59636e' stroke-width='1.5' marker-end='url(#arrow)'/><rect x='20' y='352' width='256' height='72' rx='8' fill='#d29922' fill-opacity='.12' stroke='#d29922' stroke-width='1.5'/><text x='32' y='378' font-size='15' font-weight='700' fill='#1f2328'>Inspect .eval log</text><text x='32' y='400' font-size='11.5' fill='#1f2328'>messages, tool calls, scores</text><text x='32' y='417' font-size='11.5' fill='#1f2328'>always written; rescored offline</text><line x1='420' y1='312' x2='420' y2='348' stroke='#59636e' stroke-width='1.5' marker-end='url(#arrow)'/><rect x='292' y='352' width='256' height='72' rx='8' fill='#0969da' fill-opacity='.12' stroke='#0969da' stroke-width='1.5'/><text x='304' y='378' font-size='15' font-weight='700' fill='#1f2328'>Weights &amp; Biases</text><text x='304' y='400' font-size='11.5' fill='#1f2328'>inspect-wandb: runs, tables</text><text x='304' y='417' font-size='11.5' fill='#1f2328'>Weave traces of agent calls</text><line x1='692' y1='312' x2='692' y2='348' stroke='#59636e' stroke-width='1.5' marker-end='url(#arrow)'/><rect x='564' y='352' width='256' height='72' rx='8' fill='#8250df' fill-opacity='.12' stroke='#8250df' stroke-width='1.5'/><text x='576' y='378' font-size='15' font-weight='700' fill='#1f2328'>Langfuse</text><text x='576' y='400' font-size='11.5' fill='#1f2328'>one trace per sample, agent calls</text><text x='576' y='417' font-size='11.5' fill='#1f2328'>scores attached to each trace</text></svg>
