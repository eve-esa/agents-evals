[project]
name = "agentic-evals"
version = "0.1.0"
description = "Evaluation harness for Earth Observation agents (EVE), built on Inspect AI."
authors = [
    { name = "elements72", email = "antonio.lopez.8523@gmail.com" }
]
requires-python = ">=3.12"
dependencies = [
    "a2a-sdk[http-server]>=1.2.2",
    "agentevals>=0.0.9",
    "httpx>=0.28.1",
    "huggingface-hub>=2.0.0",
    "inspect-ai>=0.3.268",
    "inspect-wandb[weave]>=0.3.0",
    "langchain>=1.4.2",
    "langchain-mcp-adapters>=0.3.2",
    "langchain-openai>=1.6.6",
    "langgraph>=1.2.12",
    # mcp 2.x removed Server.list_tools / call_tool, which the GeoBenchX stdio server uses.
    "mcp>=1.30.0,<2",
    # Specialists solver: tool clustering and the specialists' A2A servers.
    "numpy>=2",
    "pyyaml>=6.0",
    "scikit-learn>=1.6",
    "uvicorn>=0.53.0",
]

[project.optional-dependencies]
earth-bench = [
    # 2.11.3 is the fastmcp Earth-Agent's kits were written against, so the
    # tool schemas the model sees stay the ones the published runs used.
    "fastmcp==2.11.3",
    "imageio>=2.37",
    "matplotlib>=3.10",
    "numpy>=2",
    "opencv-python-headless>=4.10",
    "pandas>=2.2",
    "pillow>=11",
    "pyproj>=3.7",
    "rasterio>=1.4",
    "ruptures>=1.1",
    "scikit-image>=0.25",
    "scikit-learn>=1.6",
    "scipy>=1.15",
    "statsmodels>=0.14",
]
geobenchx = [
    "contextily>=1.6",
    "gdown>=5.2",
    "geopandas>=1.0",
    "matplotlib>=3.10",
    "numpy>=2",
    "pandas>=2.2",
    "plotly>=6",
    "pyproj>=3.7",
    "rasterio>=1.4",
    "shapely>=2.0",
]

[project.entry-points.inspect_ai]
agentic_evals = "agentic_evals._registry"

[build-system]
requires = ["uv_build>=0.10.12,<0.11.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "pytest>=9.1.1",
]

# inspect-wandb mirrors every eval to the Forge project agentic_evals.
# The .eval log remains the source of truth. Models logging and Weave are on.
# Weave logs each sample as an Evaluation prediction; agents.weave_trace nests
# agent runs, model turns, tool calls and A2A delegations under it. Set
# INSPECT_WANDB_WEAVE_ENABLED=false to turn Weave off for a run. On the pod, WANDB_BASE_URL is
# https://forge.coreweave.com/api/wandb (the API). The workspace UI is
# https://forge.coreweave.com/wandb (WANDB_APP_URL). WANDB_API_KEY is not committed.
[tool.inspect-wandb.models]
entity = "LLM4EO"
project = "agentic_evals"
enabled = true

[tool.inspect-wandb.weave]
entity = "LLM4EO"
project = "agentic_evals"
enabled = true

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = [
    "upstream: compares a port against the copied upstream files in this repo",
]
