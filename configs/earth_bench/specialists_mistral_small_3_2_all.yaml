# Full Earth-Bench (AP, all modalities: 248 samples) with the orchestrator and A2A specialists (agents/specialists),
# Mistral Small 3.2 24B Instruct via OpenRouter. Same task, solver and generate
# settings as specialists_qwen3_32b.yaml, so the two runs differ only
# in the model. The model has no thinking mode, so there is no
# reasoning switch here.
#
# The solver reads the committed clusters/earth_bench.json, so no embedding
# call is made. Each specialist's model calls go through the eval's model.
#
# All samples, ten at a time. Weave and W&B model logging are on through
# [tool.inspect-wandb] in pyproject.toml; set INSPECT_WANDB_WEAVE_ENABLED=false to
# turn Weave off for a run.
#
#   uv run inspect eval --run-config configs/earth_bench/specialists_mistral_small_3_2_all.yaml --display plain

task:
  task: agentic_evals/earth_bench
  args:
    regime: ap
    modality: all

solver:
  solver: agentic_evals/langgraph_specialists
  args:
    shared_tools: [get_filelist]

model:
  model: openai-api/openrouter/mistralai/mistral-small-3.2-24b-instruct
  base_url: https://openrouter.ai/api/v1
  args:
    strict_tools: false

generate_config:
  temperature: 0.1
  max_tokens: -1
  max_retries: 5

eval_config:
  epochs: 1
  max_samples: 10
  fail_on_error: false
