# GeoBenchX with the orchestrator and A2A specialists (agents/specialists),
# Mistral Small 3.2 24B Instruct via OpenRouter, pinned to venice (the only host
# with a 256k context; see the geobenchx task docstring).
#
# The solver reads the committed clusters/geobenchx.json (k-means, number of
# specialists picked by silhouette), so no embedding call is made. GeoBenchX has
# no get_filelist tool, so the orchestrator keeps no task tools of its own.
#
# Temperature 0 as in upstream's execute_task. The grader is GPT-4.1, the
# model that scored evaluator_tuning_set.json, through OpenRouter.
#
# Five questions, five at a time: the first five task_IDs (three control, one
# unsolvable, one solvable).
#
#   uv run inspect eval --run-config configs/geobenchx/specialists_mistral_small_3_2.yaml --display plain

task:
  task: agentic_evals/geobenchx
  args:
    openrouter_only: venice

solver:
  solver: agentic_evals/langgraph_specialists
  args:
    orchestrator_tools: []

model:
  model: openai-api/openrouter/mistralai/mistral-small-3.2-24b-instruct
  base_url: https://openrouter.ai/api/v1
  args:
    strict_tools: false

model_roles:
  grader:
    model: openai-api/openrouter/openai/gpt-4.1
    base_url: https://openrouter.ai/api/v1

generate_config:
  temperature: 0
  max_tokens: -1
  max_retries: 5

eval_config:
  sample_id:
    - TASK_250309_135125_364138
    - TASK_250309_135125_299410
    - TASK_250309_135125_483163
    - TASK_250309_135125_315340
    - TASK_250309_135125_734213
  epochs: 1
  max_samples: 5
  fail_on_error: false
