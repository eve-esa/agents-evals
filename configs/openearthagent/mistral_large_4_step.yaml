# OpenEarthAgent step (teacher-forced): Mistral Large 4 on OpenRouter.
#
# Shabbir et al., arXiv:2602.17665, Table 3. Each gold turn is one sample.
# No tools run. max_iterations is recorded; the solver is still one
# generate() per gold turn. The end-to-end run is
# configs/openearthagent/mistral_large_4.yaml.
#
# Solver: https://docs.mistral.ai/models/mistral-large-4-0 (6 Oct 2026,
# multimodal, function calling). OpenRouter's live /api/v1/models listing
# (14 Oct 2026) reports mistralai/mistral-large-4-0 with context 1048576,
# text and image input, and reasoning_effort. Vision is off for now: the 533
# image tasks are not applicable and are not scored, so this run covers
# the text tasks only and is not Table 3's full task set. Temperature 0.4
# and max_tokens 256 are the upstream OpenAI driver's settings (task.py).
#
# https://docs.mistral.ai/capabilities/reasoning — "none" keeps content a
# string. The official answer judge stays gpt-4o-mini. The October panel
# is extra answer judges and stays off the official score.
#
#   uv run inspect eval --run-config configs/openearthagent/mistral_large_4_step.yaml --display plain

task:
  task: agentic_evals/openearthagent
  args:
    max_iterations: 5
    regime: step
    vision: false
    judges: openai-api/openrouter/deepseek/deepseek-v3.2,openai-api/openrouter/openai/gpt-6-luna,openai-api/openrouter/qwen/qwen3.8-flash,openai-api/mistral/mistral-large-2512

model:
  model: openai-api/openrouter/mistralai/mistral-large-4-0
  base_url: https://openrouter.ai/api/v1

model_roles:
  grader:
    model: openai-api/openrouter/openai/gpt-4o-mini
    base_url: https://openrouter.ai/api/v1

generate_config:
  temperature: 0.4
  reasoning_effort: none
  max_tokens: 256
  max_retries: 6
  stream_idle_timeout: 180

eval_config:
  epochs: 1
  max_samples: 8
  fail_on_error: false
