# GeoBenchX full run: Mistral Large 4 on Mistral's API.
#
# Krechetova & Kochedykov, SIGSPATIAL 2025, arXiv:2503.18129, Section 5.
# Upstream execute_task uses temperature 0 and recursion_limit 25 (set on
# the task). max_tokens -1 records no output cap (agentic_evals.max_tokens).
# Mistral Large 4 rejects temperature 0 unless top_p is 1
# (invalid_request_greedy_sampling, code 3054, api.mistral.ai, 7 Oct 2026).
# reasoning_effort none omits the thinking chunk so content stays a string
# (https://docs.mistral.ai/capabilities/reasoning).
#
# Solver: https://docs.mistral.ai/models/mistral-large-4-0 (6 Oct 2026).
# The live /v1/models listing reports mistral-large-4-0, context 524288.
# Function calling is on the model card.
#
# The match panel is the one used on the October runs, not the paper's
# retired checkpoints. The grader role is one judge. The other three are
# extra scorers. geobenchx_panel is the unweighted mean of those shares.
# Mistral Large 2512 is judged on Mistral's API; the other three go through
# OpenRouter. The launch must export OPENROUTER_BASE_URL.
#
# group all and kind all. max_samples 8 matches the earlier full runs.
# This pod has 4 CPUs. generate_contours_display still needs GDAL on PATH.
#
#   uv run inspect eval --run-config configs/geobenchx_mistral_large_4.yaml --display plain

task:
  task: agentic_evals/geobenchx
  args:
    group: all
    kind: all
    judges: openai-api/openrouter/openai/gpt-6-luna,openai-api/openrouter/qwen/qwen3.8-flash,openai-api/mistral/mistral-large-2512

model:
  model: openai-api/mistral/mistral-large-4-0
  base_url: https://api.mistral.ai/v1
  args:
    strict_tools: false

model_roles:
  grader:
    model: openai-api/openrouter/deepseek/deepseek-v3.2
    base_url: https://openrouter.ai/api/v1

generate_config:
  temperature: 0
  # Temperature 0 is greedy. Mistral rejects that unless top_p is 1
  # (HTTP 400, code 3054, invalid_request_greedy_sampling).
  top_p: 1
  max_tokens: -1
  max_retries: 6
  stream_idle_timeout: 180
  # https://docs.mistral.ai/capabilities/reasoning — "none" keeps content a string.
  reasoning_effort: none

eval_config:
  epochs: 1
  max_samples: 8
  fail_on_error: false
