# Earth-Bench full Auto-Planning run: Qwen3-32B via OpenRouter, reasoning off.
#
# Feng et al., Earth-Agent (ICLR 2026), Table 7. Their runner
# (scripts/langchain_qwen3_32B_autoplan.py, agent/config_qwen3.json) sets
# temperature 0.1 and enable_thinking: false, and does not set max_tokens.
# OpenRouter's form of that switch is reasoning.enabled
# (https://openrouter.ai/docs/guides/best-practices/reasoning-tokens).
#
# The model card caps a completion at 16,384 tokens
# (https://openrouter.ai/qwen/qwen3-32b). DeepInfra's window is 40,960, and
# the tool schemas already use ~28k tokens, so a 16,384 reply does not fit
# there. SiliconFlow serves the same checkpoint with a 131,072 window
# (live endpoints listing, 2026-09-25). Pin that provider and refuse fallback
# (https://openrouter.ai/docs/guides/routing/provider-selection).
# SiliconFlow price is $0.14 / $0.57 per 1M input/output tokens.
#
# modality all includes RGB (questions 189-248). Those samples are left
# unscored unless Perception's lookup exists at the path hardcoded in
# agent/tools/Perception.py (/root/autodl-tmp/Earth-Agent/benchmark/model_results.csv).
# Spectrum and Products do not need it.
#
# max_samples 8 runs eight questions at once. The pod cgroup is 16 GB and one
# question's five tool servers use about 1 GB, so eight leaves headroom for
# raster spikes. The pod has 4 CPUs.
#
#   uv run inspect eval --run-config configs/earth_bench_qwen3_32b_full.yaml --display plain

task:
  task: agentic_evals/earth_bench
  args:
    regime: ap
    modality: all

model:
  model: openai-api/openrouter/qwen/qwen3-32b
  base_url: https://openrouter.ai/api/v1
  args:
    strict_tools: false

generate_config:
  temperature: 0.1
  max_tokens: 16384
  max_retries: 5
  extra_body:
    reasoning:
      enabled: false
    provider:
      only: ["siliconflow"]
      allow_fallbacks: false

eval_config:
  epochs: 1
  max_samples: 8
  # One broken task must not abort the others.
  fail_on_error: false
