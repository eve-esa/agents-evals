# One OpenEarthAgent step turn, so a W&B run carries the metric guide.
#
# Task 0, turn 6 is the Terminate answer for the Banff question. Step mode
# does not call tools. The solver and the grader both go through OpenRouter,
# matching configs/earth_bench_qwen3_32b.yaml. Inspect reads .env from this
# directory for OPENAI_API_KEY / the OpenRouter key.
#
#   uv run inspect eval --run-config configs/openearthagent_step_smoke.yaml

task:
  task: agentic_evals/openearthagent
  args:
    regime: step
    vision: false
    task_id: "0"

model:
  model: openai-api/openrouter/openai/gpt-4o-mini
  base_url: https://openrouter.ai/api/v1

model_roles:
  grader:
    model: openai-api/openrouter/openai/gpt-4o-mini
    base_url: https://openrouter.ai/api/v1

generate_config:
  temperature: 0.4
  max_tokens: 256

eval_config:
  sample_id: ["0:6"]
  epochs: 1
