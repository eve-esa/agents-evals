[build-system]
requires = ["setuptools>=69", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "eo-gym"
version = "0.1.0"
description = "EO-Gym tool server, copied into this task. See ../PORTING.md."
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.115.0",
    "gymnasium>=1.0.0",
    "httpx>=0.28.0",
    "numpy>=2.0.0",
    "omegaconf>=2.3.0",
    "openai>=1.54.0",
    "pandas>=2.2.0",
    "pillow>=11.0.0",
    "pydantic>=2.9.0",
    "qwen-vl-utils>=0.0.8",
    "rasterio>=1.4.0",
    "requests>=2.32.0",
    "torch>=2.4.0",
    "transformers>=4.47.0",
    "uvicorn>=0.32.0",
    "xarray>=2024.10.0",
]

[tool.setuptools.packages.find]
where = ["."]
include = ["eo_gym*"]
