# Imagery and lookup tables live in the gitignored download directory, five
# levels above this file (repo data/eo_gym). setup.py fetches them.

[paths]
data_dir = "../../../../../data/eo_gym/EO_GYM_DATA"
image_cache_dir = "../../../../../data/eo_gym/image_cache"
vqa_outputs_dir = "../../../../../data/eo_gym/VQA_outputs"
vqa_mask_mapping_dir = "../../../../../data/eo_gym/index_files"
fmow_meta_root = "../../../../../data/eo_gym/fmow/seq"

[models]
sam3_model_id = "facebook/sam3"
local_vlm_model_id_or_path = "Qwen/Qwen2.5-VL-3B-Instruct"
bbox_match_model_id_or_path = "Qwen/Qwen2.5-0.5B-Instruct"
local_vlm_local_files_only = true

[urls]
public_data_base_url = "https://dea-public-data-dev.s3.ap-southeast-2.amazonaws.com/projects/dea-reasoning/"

[server]
host = "0.0.0.0"
port = 8081
device = "cpu"
preload_tools = []
preload_models = []
access_log = false
cache_enabled = true
cache_max_entries = 4096
cache_ttl_secs = 3600.0
cache_errors = false
max_concurrent_executes = 4
